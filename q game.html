<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Web Design Layout</title>

  <style>
    .quiz-container {
      background: #fff;
      padding: 20px 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .quiz-container h2 {
      margin-bottom: 15px;
    }

    .quiz-container .option {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      background: #eee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
    }

    .quiz-container .option:hover {
      background-color: #cde5ff;
    }

    .quiz-container .option.correct {
      background-color: #a4edb7;
    }

    .quiz-container .option.wrong {
      background-color: #f7a4a4;
    }

    .quiz-container .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .quiz-container .btn:hover {
      background-color: #0056b3;
    }

    #quiz-timer {
      font-size: 18px;
      margin-bottom: 10px;
      color: #ff0000;
      font-weight: bold;
    }

    .quiz-container .result {
      font-size: 18px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="row">

            <div class="scoreboard">
              <div class="score-label">
                Score:
                <span id="score">0</span>

          <div id="quiz-options"></div>
          <button class="btn" onclick="nextQuizQuestion()">Next</button>
          <div class="result" id="quiz-result"></div>

Columbus, OH 43215, United States</div>

  <script>
    const quizData = [
      {
        question: "What is the capital of France?",
        options: ["Berlin", "Paris", "Madrid", "Lisbon"],
        answer: "Paris"
      },
      {
        question: "Who wrote 'Hamlet'?",
        options: ["William Shakespeare", "Leo Tolstoy", "Jane Austen", "Mark Twain"],
        answer: "William Shakespeare"
      },
      {
        question: "Largest planet in our Solar System?",
        options: ["Earth", "Saturn", "Mars", "Jupiter"],
        answer: "Jupiter"
      },
      {
        question: "Language used for web apps?",
        options: ["C++", "Python", "Java", "JavaScript"],
        answer: "JavaScript"
      },
      {
        question: "How many continents on Earth?",
        options: ["5", "6", "7", "8"],
        answer: "7"
      },
      {
        question: "Gas absorbed by plants?",
        options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
        answer: "Carbon Dioxide"
      },
      {
        question: "9 x 9 = ?",
        options: ["81", "99", "72", "90"],
        answer: "81"
      },
      {
        question: "Fastest land animal?",
        options: ["Tiger", "Horse", "Cheetah", "Lion"],
        answer: "Cheetah"
      },
      {
        question: "Sun rises from?",
        options: ["West", "East", "North", "South"],
        answer: "East"
      },
      {
        question: "Water boils at?",
        options: ["100°C", "80°C", "90°C", "110°C"],
        answer: "100°C"
      }
    ];

    let quizCurrentQuestion = 0;
    let quizScore = 0;
    let quizTimerInterval;
    let quizTimeLeft = 15;
    let quizAnswered = false;

    function startQuizTimer() {
      quizTimeLeft = 15;
      document.getElementById("quiz-timer").innerText = `Time Left: ${quizTimeLeft}s`;
      quizTimerInterval = setInterval(() => {
        quizTimeLeft--;
        document.getElementById("quiz-timer").innerText = `Time Left: ${quizTimeLeft}s`;
        if (quizTimeLeft <= 0) {
          clearInterval(quizTimerInterval);
          if (!quizAnswered) {
            showQuizCorrectAnswer();
          }
        }
      }, 1000);
    }

    function loadQuizQuestion() {
      const q = quizData[quizCurrentQuestion];
      document.getElementById("quiz-question").innerText = `${quizCurrentQuestion + 1}. ${q.question}`;
      const optionsContainer = document.getElementById("quiz-options");
      optionsContainer.innerHTML = "";
      document.getElementById("quiz-result").innerText = "";
      quizAnswered = false;

      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = option;
        btn.onclick = () => checkQuizAnswer(btn, option);
        optionsContainer.appendChild(btn);
      });

      clearInterval(quizTimerInterval);
      startQuizTimer();
    }

    function checkQuizAnswer(btn, selectedOption) {
      if (quizAnswered) return;
      quizAnswered = true;
      clearInterval(quizTimerInterval);
      const correctAnswer = quizData[quizCurrentQuestion].answer;

      const buttons = document.querySelectorAll(".quiz-container .option");
      buttons.forEach(b => {
        b.disabled = true;
        if (b.innerText === correctAnswer) b.classList.add("correct");
        if (b.innerText === selectedOption && selectedOption !== correctAnswer) {
          b.classList.add("wrong");
        }
      });

      if (selectedOption === correctAnswer) {
        quizScore++;
        document.getElementById("quiz-result").innerText = "Correct!";
      } else {
        document.getElementById("quiz-result").innerText = `Wrong! Correct answer: ${correctAnswer}`;
      }
    }

    function showQuizCorrectAnswer() {
      quizAnswered = true;
      const correctAnswer = quizData[quizCurrentQuestion].answer;
      const buttons = document.querySelectorAll(".quiz-container .option");
      buttons.forEach(b => {
        b.disabled = true;
        if (b.innerText === correctAnswer) {
          b.classList.add("correct");
        }
      });
      document.getElementById("quiz-result").innerText = `Time's up! Correct answer: ${correctAnswer}`;
    }

    function nextQuizQuestion() {
      if (quizCurrentQuestion < quizData.length - 1) {
        quizCurrentQuestion++;
        loadQuizQuestion();
      } else {
        showQuizFinalResult();
      }
    }

    function resetQuizGame() {
      clearInterval(quizTimerInterval);
      quizCurrentQuestion = 0;
      quizScore = 0;
      const container = document.querySelector(".quiz-container");
      container.innerHTML = `
        <div id="quiz-timer">Time Left: 15s</div>
        <h2 id="quiz-question">Question</h2>
        <div id="quiz-options"></div>
        <button class="btn" onclick="nextQuizQuestion()">Next</button>
        <div class="result" id="quiz-result"></div>
      `;
      loadQuizQuestion();
    }

    function showQuizFinalResult() {
      clearInterval(quizTimerInterval);
      const container = document.querySelector(".quiz-container");
      container.innerHTML = `
        <h2>🏆 Quiz Completed!</h2>
        <p class="result">Your Score: ${quizScore} / ${quizData.length}</p>
        <p class="result">${getQuizRank(quizScore)}</p>
        <button class="btn" onclick="resetQuizGame()">Play Again</button>
      `;
    }

    function getQuizRank(score) {
      if (score === 10) return "🌟 Excellent! You're a genius!";
      if (score >= 7) return "👏 Great job!";
      if (score >= 5) return "🙂 Good effort!";
      return "😢 Better luck next time!";
    }

    loadQuizQuestion();
  </script>

</body>
</html>
